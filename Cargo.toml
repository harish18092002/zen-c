[workspace]
members = [
    "crates/zen-domain",
    "crates/zen-core",
    "crates/zen-db",
    "crates/zen-os",
    "crates/zen-macos",
    "crates/zen-windows",
    "crates/zen-sync",
    "crates/zen-telemetry",
    "crates/zen-cli",
    "apps/desktop-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Zen Mode Team"]
license = "UNLICENSED"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "time", "uuid"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
